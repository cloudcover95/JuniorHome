name: CI - Cross Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short || echo "No tests yet or some skipped"

    - name: Check imports and basic functionality
      run: |
        python -c "from src.design.vlm_design_agent import VLMDesignAgent; print('VLMDesignAgent import OK')"
        python -c "from src.memory.graph_memory_blackbox import GraphMemoryBlackbox; print('GraphMemoryBlackbox import OK')"
        python -c "from src.automation.cad_script_generator import CADScriptGenerator; print('CADScriptGenerator import OK')"

    - name: Platform info
      run: |
        python -c "import platform; print(platform.system(), platform.machine())"
