# path: docker-compose.yml

version: '3.8'

services:
  juniorclimbs:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - juniorclimbs_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - NOTIFICATION_CHANNEL=email  # email | slack | telegram
    restart: unless-stopped

volumes:
  juniorclimbs_data:
