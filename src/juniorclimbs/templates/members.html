<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; background: #f8f9fa; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 700px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Members</h2>
        <table>
            <tr><th>Name</th><th>Balance</th><th>Status</th></tr>
            {% for m in members %}
            <tr>
                <td>{{ m.full_name }}</td>
                <td>${{ m.current_balance }}</td>
                <td>{{ m.status }}</td>
            </tr>
            {% endfor %}
        </table>
        <p><a href="/">Back to Dashboard</a></p>
    </div>
</body>
</html>
