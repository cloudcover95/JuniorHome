<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; background: #f8f9fa; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; }
        input, select, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Point of Sale</h2>
        <form method="post" action="/pos">
            <input type="text" name="member_id" placeholder="Member ID" required>
            <select name="item_type" required>
                <option value="day_pass">Day Pass</option>
                <option value="merch">Merchandise</option>
                <option value="food">Food / Drink</option>
            </select>
            <input type="number" step="0.01" name="amount" placeholder="Amount" required>
            <button type="submit">Complete Sale</button>
        </form>
        <p><a href="/">Back to Dashboard</a></p>
    </div>
</body>
</html>
