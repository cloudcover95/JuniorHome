<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; margin: 40px; background: #f8f9fa; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; }
        .area { padding: 12px; margin: 8px 0; background: #f1f3f5; border-radius: 8px; }
        button { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Safety Zones</h2>
        {% for area in areas %}
        <div class="area">
            <strong>{{ area.name }}</strong> ({{ area.area_type }})<br>
            Status: <strong>{{ area.status }}</strong><br>
            <form method="post" action="/safety/update" style="display:inline;">
                <input type="hidden" name="area_id" value="{{ area.id }}">
                <select name="status">
                    <option value="open">Open</option>
                    <option value="restricted">Restricted</option>
                    <option value="closed">Closed</option>
                </select>
                <button type="submit">Update</button>
            </form>
        </div>
        {% endfor %}
        <p><a href="/">Back to Dashboard</a></p>
    </div>
</body>
</html>
