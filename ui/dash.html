<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JuniorHome dash</title>
<style>
  :root { --gold:#e6c35c; --ink:#0b0d10; --plate:#16130c; --scale:1; }
  body { margin:0; background:var(--ink); color:#f2ead8; font:14px/1.4 ui-sans-serif,system-ui; }
  header { padding:12px 16px; letter-spacing:.14em; color:var(--gold); border-bottom:1px solid #3a3420; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  main { display:grid; gap:12px; padding:12px; }
  body.landscape main { grid-template-columns: 180px 1fr 1fr; }
  body.portrait main { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; }
  section { background:var(--plate); border:1px solid #3a3420; padding:12px; }
  h2 { color:var(--gold); font-size:12px; letter-spacing:.16em; }
  button, a { color:var(--gold); background:transparent; border:1px solid #3a3420; padding:6px 8px; margin:4px 4px 4px 0; text-decoration:none; }
  textarea { width:95%; background:#111; color:#f2ead8; border:1px solid #3a3420; }
  pre { white-space:pre-wrap; }
  .chip { display:inline-block; margin:3px; padding:3px 8px; border:1px solid var(--gold); }
  #stage { transform: scale(var(--scale)); transform-origin: top center; }
</style>
<header>
  <span>JUNIORHOME · DASH</span>
  <span>
    <button type="button" id="land">landscape</button>
    <button type="button" id="port">portrait</button>
    <button type="button" data-s="0.7">0.7</button>
    <button type="button" data-s="1">1.0</button>
    <a href="gaia.html">companion</a>
    <a href="index.html">clock</a>
  </span>
</header>
<div id="stage">
<main>
  <section>
    <h2>MODULES</h2>
    <button data-m="home">home / vault</button>
    <button data-m="notes">notes</button>
    <button data-m="cad">cad / omega</button>
    <button data-m="stock">stock</button>
    <button data-m="field">field (opt)</button>
  </section>
  <section>
    <h2>VIEWPORT</h2>
    <p id="mod">home</p>
    <p id="geom"></p>
    <div id="chips"></div>
  </section>
  <section>
    <h2>NOTE → TRIT</h2>
    <textarea id="t" rows="5">buy oats and fix the porch light</textarea>
    <p><button type="button" id="go">run</button></p>
    <pre id="o"></pre>
  </section>
</main>
</div>
<script>
const copy = {
  home: ['vault','8770','8771'],
  notes: ['journal','scan','media'],
  cad: ['dxf','obj','omega'],
  stock: ['book','fill','ledger'],
  field: ['optional','covenant']
};
let orient = matchMedia('(orientation: portrait)').matches ? 'portrait' : 'landscape';
let scale = 1;
function geom(){
  const max = orient==='portrait' ? [1080,1920] : [1920,1080];
  document.body.className = orient;
  document.documentElement.style.setProperty('--scale', scale);
  document.getElementById('geom').textContent =
    orient + ' · scale ' + scale + ' · max ' + max[0] + 'x' + max[1];
}
function pane(m){
  document.getElementById('mod').textContent = m;
  document.getElementById('chips').innerHTML = (copy[m]||[]).map(x=>'<span class="chip">'+x+'</span>').join('');
}
document.getElementById('land').onclick=()=>{orient='landscape'; geom();};
document.getElementById('port').onclick=()=>{orient='portrait'; geom();};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{scale=parseFloat(b.dataset.s); geom();});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>pane(b.dataset.m));
document.getElementById('go').onclick=()=>{
  document.getElementById('o').textContent = JSON.stringify({note:document.getElementById('t').value, orient, scale}, null, 2);
};
geom(); pane('home');
</script>
