<!doctype html>
<meta charset="utf-8">
<title>JuniorHome dash</title>
<style>
  :root { --gold:#e6c35c; --ink:#0b0d10; --plate:#16130c; }
  body { margin:0; background:var(--ink); color:#f2ead8; font:14px/1.4 ui-sans-serif,system-ui; }
  header { padding:16px 20px; letter-spacing:.14em; color:var(--gold); border-bottom:1px solid #3a3420; display:flex; justify-content:space-between; }
  main { display:grid; grid-template-columns: 180px 1fr 1fr; gap:12px; padding:12px; }
  section { background:var(--plate); border:1px solid #3a3420; padding:12px; min-height:260px; }
  h2 { color:var(--gold); font-size:12px; letter-spacing:.16em; }
  button, a { color:var(--gold); background:transparent; border:1px solid #3a3420; padding:6px 8px; display:block; margin:4px 0; text-decoration:none; }
  textarea { width:95%; background:#111; color:#f2ead8; border:1px solid #3a3420; }
  pre { white-space:pre-wrap; }
  .chip { display:inline-block; margin:3px; padding:3px 8px; border:1px solid var(--gold); }
</style>
<header><span>JUNIORHOME · GAIA</span><span>loopback · 1.58</span></header>
<main>
  <section>
    <h2>MODULES</h2>
    <button data-m="home">home / vault</button>
    <button data-m="notes">notes</button>
    <button data-m="cad">cad / omega</button>
    <button data-m="stock">stock</button>
    <button data-m="field">field (opt)</button>
    <a href="gaia.html">portrait</a>
    <a href="index.html">clock</a>
  </section>
  <section>
    <h2>VIEWPORT</h2>
    <p id="mod">home</p>
    <p id="walk"></p>
    <div id="chips"></div>
  </section>
  <section>
    <h2>NOTE → TRIT</h2>
    <textarea id="t" rows="5">buy oats and fix the porch light</textarea>
    <p><button id="go" style="display:inline">run</button></p>
    <pre id="o"></pre>
  </section>
</main>
<script>
const copy = {
  home: {walk:'Gaia stays on the clock', chips:['vault','hook :8770','ui :8771']},
  notes: {walk:'Gaia opens the notebook', chips:['journal','scan','media']},
  cad: {walk:'Gaia to Omega / OBJ', chips:['dxf','title block','terrain obj']},
  stock: {walk:'Gaia to JuniorStock node', chips:['book','fill','ledger']},
  field: {walk:'optional — Flagstaff / Xanadu / Creek', chips:['holds','trad+','covenant']}
};
function pane(m){
  const c = copy[m] || copy.home;
  document.getElementById('mod').textContent = m;
  document.getElementById('walk').textContent = c.walk;
  document.getElementById('chips').innerHTML = c.chips.map(x=>'<span class="chip">'+x+'</span>').join('');
}
document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>pane(b.dataset.m));
document.getElementById('go').onclick=()=>{
  const t = document.getElementById('t').value;
  document.getElementById('o').textContent = 'local 1.58 note (no scrape)\n' + t;
};
pane('home');
</script>
