<!doctype html>
<meta charset="utf-8">
<title>JuniorHome dash</title>
<style>
  :root { --gold:#e6c35c; --ink:#0b0d10; --plate:#16130c; }
  body { margin:0; background:var(--ink); color:#f2ead8; font:14px/1.4 ui-sans-serif,system-ui; }
  header { padding:16px 20px; letter-spacing:.14em; color:var(--gold); border-bottom:1px solid #3a3420; }
  main { display:grid; grid-template-columns: 220px 1fr 1fr; gap:12px; padding:12px; }
  section { background:var(--plate); border:1px solid #3a3420; padding:12px; min-height:280px; }
  h2 { color:var(--gold); font-size:12px; letter-spacing:.16em; }
  .hold { display:inline-block; margin:4px; padding:4px 8px; border:1px solid var(--gold); }
  a { color:var(--gold); }
  pre { white-space:pre-wrap; }
</style>
<header>JUNIORHOME · GAIA · STONEFIELD</header>
<main>
  <section>
    <h2>NODES</h2>
    <p><button data-q="flagstaff mountain">Flagstaff Mtn</button></p>
    <p><button data-q="xanadu">Mt. Xanadu</button></p>
    <p><button data-q="golden clear creek">Clear Creek</button></p>
    <p><a href="gaia.html">portrait</a> · <a href="index.html">clock</a></p>
  </section>
  <section>
    <h2>VIEWPORT</h2>
    <div id="holds"></div>
    <div id="routes"></div>
    <p id="walk"></p>
  </section>
  <section>
    <h2>THREAD</h2>
    <textarea id="t" rows="4" style="width:95%;background:#111;color:#f2ead8;border:1px solid #3a3420">beta on the picnic slab</textarea>
    <p><button id="talk">note</button></p>
    <pre id="o"></pre>
  </section>
</main>
<script>
const seed = {
  "flagstaff mountain": {holds:["jug","crimp","edge","smear"], routes:["picnic slab V1 boulder","west face 5.6 trad"], walk:["home","Boulder CO","Flagstaff Mountain"]},
  "xanadu": {holds:["sloper","pinch","crimp"], routes:["classic line V4 boulder"], walk:["home","Front Range","Mt. Xanadu"]},
  "golden clear creek": {holds:["crack","edge","horn"], routes:["creek crack 5.8 trad"], walk:["home","Golden CO","Clear Creek Canyon"]}
};
function show(q){
  const n = seed[q];
  if(!n) return;
  document.getElementById('holds').innerHTML = n.holds.map(h=>'<span class="hold">'+h+'</span>').join('');
  document.getElementById('routes').innerHTML = n.routes.map(r=>'<p>'+r+'</p>').join('');
  document.getElementById('walk').textContent = 'Gaia walk: ' + n.walk.join(' → ');
}
document.querySelectorAll('button[data-q]').forEach(b=>b.onclick=()=>show(b.dataset.q));
document.getElementById('talk').onclick=()=>{
  document.getElementById('o').textContent = 'local thread (no MP): ' + document.getElementById('t').value;
};
show('flagstaff mountain');
</script>
