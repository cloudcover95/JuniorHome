[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "juniorhome"
version = "0.2.0"
description = "JuniorCloud sovereign edge intelligence ecosystem - BitNet, plasticity, coordination"
authors = [{name = "JuniorCloud LLC"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.4",
]
# Platform-specific notes:
# - MLX: Apple Silicon / macOS only (M-series)
# - For CPU-only or NVIDIA: use numpy + CUDA paths in future BitNet backends
apple-silicon = ["mlx>=0.15"]
cpu = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
target-version = "py310"
